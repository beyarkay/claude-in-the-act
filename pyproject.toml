[project]
name = "slash-bad"
version = "0.2.0"
description = "Your personal benchmark for the things you actually care about: /bad in Claude Code and Codex"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []  # stdlib only at runtime

[project.scripts]
slash-bad = "slash_bad.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slash_bad"]

[dependency-groups]
dev = ["ty", "pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not e2e'"
markers = [
    "e2e: end-to-end tests that spawn the real `claude` CLI (cost money + network; opt in with `-m e2e`)",
]
