default_install_hook_types: [pre-commit, post-commit]
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uvx ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check --fix
        entry: uvx ruff check --fix
        language: system
        types: [python]
      - id: shellcheck
        name: shellcheck
        entry: uvx --from shellcheck-py shellcheck
        language: system
        files: ^(bin|scripts)/
      - id: pytest
        name: pytest (all tests)
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        always_run: true
      - id: refresh-codex-plugin
        name: refresh Codex's copy of the plugin
        entry: scripts/refresh-codex-plugin
        language: system
        pass_filenames: false
        always_run: true
        stages: [post-commit]
